services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: 'neo4j/change-me'
    ports:
      - '7474:7474'
      - '7687:7687'

  qdrant:
    image: qdrant/qdrant:v1.5.0
    ports:
      - '6333:6333'

  backend:
    build:
      context: ../backend
    env_file: .env
    depends_on:
      - postgres
      - redis
      - neo4j
      - qdrant
    ports:
      - '8000:8000'
    volumes:
      - ../backend:/app
      - repos_data:/repos_storage

  frontend:
    build:
      context: ../frontend
    env_file: .env
    ports:
      - '3000:3000'
    volumes:
      - ../frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  repos_data:
